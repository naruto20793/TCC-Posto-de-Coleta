# Frontend estático e API Express em Netlify Functions.
[build]
  base = "."
  publish = "public"
  command = ""

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["bcryptjs", "cors", "dotenv", "express", "express-validator", "helmet", "jsonwebtoken", "mongoose", "serverless-http"]
  included_files = ["backend/**/*.js"]
